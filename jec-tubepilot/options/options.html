<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TubePilot — Settings</title>
  <link rel="stylesheet" href="../lib/tp.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="tp-root">
  <header class="op-top">
    <span id="logo"></span>
    <div><b class="op-brand">TubePilot</b><div class="tp-small tp-muted" data-i18n="op.subtitle"></div></div>
    <span class="tp-grow"></span>
    <label class="op-lang"><span data-icon="globe"></span><select id="uiLang" class="tp-select"></select></label>
  </header>

  <div class="op-layout">
    <nav class="op-nav" id="nav">
      <a href="#start" data-icon="zap"><span data-i18n="op.nav.start"></span></a>
      <a href="#engine" data-icon="sparkles"><span data-i18n="op.nav.engine"></span></a>
      <a href="#youtube" data-icon="video"><span data-i18n="op.nav.youtube"></span></a>
      <a href="#kp" data-icon="chart"><span data-i18n="op.nav.kp"></span></a>
      <a href="#studio" data-icon="wand"><span data-i18n="op.nav.studio"></span></a>
      <a href="#profiles" data-icon="users"><span data-i18n="op.nav.profiles"></span></a>
      <a href="#backup" data-icon="download"><span data-i18n="op.nav.backup"></span></a>
      <a href="#about" data-icon="info"><span data-i18n="op.nav.about"></span></a>
    </nav>

    <main class="op-main">
      <!-- Démarrage -->
      <section id="start" class="tp-card op-hero">
        <div class="tp-card__body">
          <div class="tp-row"><span class="tp-acc__icon" data-icon="zap"></span><h2 class="tp-h1" data-i18n="op.start.title"></h2></div>
          <p class="tp-muted" data-i18n="op.start.text"></p>
          <ol class="op-steps" id="steps">
            <li data-step="engine"><span class="op-dot"></span><div><b data-i18n="op.start.s1"></b><div class="tp-small tp-muted" data-i18n="op.start.s1d"></div></div><button class="tp-btn tp-btn--sm" id="openGem"><span data-icon="external"></span><span data-i18n="op.start.openGemini"></span></button></li>
            <li data-step="profile"><span class="op-dot"></span><div><b data-i18n="op.start.s2"></b><div class="tp-small tp-muted" data-i18n="op.start.s2d"></div></div><a class="tp-btn tp-btn--sm" href="#profiles"><span data-i18n="op.start.go"></span></a></li>
            <li data-step="yt"><span class="op-dot"></span><div><b data-i18n="op.start.s3"></b><div class="tp-small tp-muted" data-i18n="op.start.s3d"></div></div><a class="tp-btn tp-btn--sm" href="#youtube"><span data-i18n="op.start.go"></span></a></li>
            <li data-step="studio"><span class="op-dot"></span><div><b data-i18n="op.start.s4"></b><div class="tp-small tp-muted" data-i18n="op.start.s4d"></div></div><a class="tp-btn tp-btn--sm tp-btn--primary" href="https://studio.youtube.com" target="_blank" rel="noopener"><span data-icon="external"></span><span data-i18n="op.start.openStudio"></span></a></li>
          </ol>
        </div>
      </section>

      <!-- Moteur IA -->
      <section id="engine" class="tp-card">
        <div class="tp-card__head"><span class="tp-acc__icon" data-icon="sparkles"></span><h2 class="tp-h2" data-i18n="op.engine.title"></h2></div>
        <div class="tp-card__body">
          <div class="op-choices">
            <label class="op-choice"><input type="radio" name="aiEngine" value="web"><div><b data-i18n="op.engine.web"></b><span class="tp-chip tp-chip--good" data-i18n="op.recommended"></span><p class="tp-small tp-muted" data-i18n="op.engine.webDesc"></p></div></label>
            <label class="op-choice"><input type="radio" name="aiEngine" value="api"><div><b data-i18n="op.engine.api"></b><p class="tp-small tp-muted" data-i18n="op.engine.apiDesc"></p></div></label>
          </div>
          <div id="webOpts" class="tp-stack">
            <div class="op-grid2">
              <label class="tp-field"><span class="tp-label" data-i18n="op.engine.url"></span><input id="geminiUrl" class="tp-input" placeholder="https://gemini.google.com/app"><span class="tp-help" data-i18n="op.engine.urlHelp"></span></label>
              <label class="tp-field"><span class="tp-label" data-i18n="op.engine.steps"></span>
                <select id="geminiSteps" class="tp-select"><option value="2" data-i18n="op.engine.steps2"></option><option value="1" data-i18n="op.engine.steps1"></option></select></label>
              <label class="tp-field"><span class="tp-label" data-i18n="op.engine.window"></span>
                <select id="geminiWindow" class="tp-select"><option value="popup" data-i18n="op.engine.popup"></option><option value="tab" data-i18n="op.engine.tab"></option></select></label>
            </div>
            <label class="tp-switch"><input type="checkbox" id="geminiClose"><span class="tp-switch__text"><span data-i18n="op.engine.close"></span></span></label>
            <div class="tp-alert tp-alert--info"><span data-icon="info"></span><span data-i18n="op.engine.webNote"></span></div>
          </div>
          <div id="apiOpts" class="tp-stack">
            <label class="tp-field"><span class="tp-label" data-i18n="op.engine.key"></span>
              <div class="tp-inputgroup"><input id="geminiKey" class="tp-input" type="password" placeholder="AIza…" autocomplete="off"><button id="testGemini" class="tp-btn"><span data-i18n="op.test"></span></button></div>
              <span class="tp-help" data-i18n-html="op.engine.keyHelp"></span></label>
            <div id="geminiStatus" class="tp-small"></div>
            <div class="op-grid2">
              <label class="tp-field"><span class="tp-label" data-i18n="op.engine.mainModel"></span><select id="modelMain" class="tp-select"></select></label>
              <label class="tp-field"><span class="tp-label" data-i18n="op.engine.fastModel"></span><select id="modelFast" class="tp-select"></select></label>
              <label class="tp-field"><span class="tp-label" data-i18n="run.media"></span>
                <select id="mediaMode" class="tp-select"><option value="auto" data-i18n="run.mediaAuto"></option><option value="audio" data-i18n="run.mediaAudio"></option><option value="video" data-i18n="run.mediaVideo"></option></select></label>
            </div>
            <label class="tp-switch"><input type="checkbox" id="deleteFiles"><span class="tp-switch__text"><span data-i18n="op.engine.deleteFiles"></span></span></label>
          </div>
          <div class="op-grid2">
            <label class="tp-field"><span class="tp-label" data-i18n="op.titleCount"></span><select id="titleCount" class="tp-select"><option>6</option><option>8</option><option>10</option><option>12</option></select></label>
          </div>
          <label class="tp-switch"><input type="checkbox" id="transcribeLyrics"><span class="tp-switch__text"><span data-i18n="run.transcribe"></span></span></label>
        </div>
      </section>

      <!-- YouTube Data API -->
      <section id="youtube" class="tp-card">
        <div class="tp-card__head"><span class="tp-acc__icon" data-icon="video"></span><h2 class="tp-h2" data-i18n="op.yt.title"></h2><span class="tp-chip" data-i18n="op.optional"></span></div>
        <div class="tp-card__body">
          <p class="tp-small tp-muted" data-i18n-html="op.yt.help"></p>
          <div class="tp-inputgroup"><input id="ytKey" class="tp-input" type="password" placeholder="AIza…" autocomplete="off"><button id="testYt" class="tp-btn"><span data-i18n="op.test"></span></button></div>
          <div id="ytStatus" class="tp-small"></div>
          <label class="tp-switch"><input type="checkbox" id="competitorLookup"><span class="tp-switch__text"><span data-i18n="run.compare"></span><span class="tp-help" data-i18n="run.compareHelp"></span></span></label>
          <label class="tp-switch"><input type="checkbox" id="webTrends"><span class="tp-switch__text"><span data-i18n="run.trends"></span></span></label>
        </div>
      </section>

      <!-- Keyword Planner -->
      <section id="kp" class="tp-card">
        <div class="tp-card__head"><span class="tp-acc__icon" data-icon="chart"></span><h2 class="tp-h2" data-i18n="kp.title"></h2><span class="tp-chip" data-i18n="op.optional"></span></div>
        <div class="tp-card__body">
          <p class="tp-small tp-muted" data-i18n="kp.help"></p>
          <ol class="tp-small op-ol"><li data-i18n-html="kp.step1"></li><li data-i18n="kp.step2"></li><li data-i18n="kp.step3"></li></ol>
          <div class="tp-row">
            <label class="tp-btn tp-btn--primary"><input type="file" id="kpFile" accept=".csv,.tsv,text/csv,text/tab-separated-values" hidden multiple><span data-icon="upload"></span><span data-i18n="kp.import"></span></label>
            <a class="tp-btn" href="https://ads.google.com/aw/keywordplanner/home" target="_blank" rel="noopener"><span data-icon="external"></span><span data-i18n="kp.open"></span></a>
            <button id="kpClear" class="tp-btn tp-btn--ghost"><span data-icon="trash"></span><span data-i18n="kp.clear"></span></button>
            <span id="kpState" class="tp-small tp-muted"></span>
          </div>
          <div id="kpMsg"></div>
        </div>
      </section>

      <!-- Studio -->
      <section id="studio" class="tp-card">
        <div class="tp-card__head"><span class="tp-acc__icon" data-icon="wand"></span><h2 class="tp-h2" data-i18n="op.studio.title"></h2></div>
        <div class="tp-card__body">
          <label class="tp-switch"><input type="checkbox" id="autopilot"><span class="tp-switch__text"><b data-i18n="op.studio.autopilot"></b><span class="tp-help" data-i18n="op.studio.autopilotHelp"></span></span></label>
          <label class="tp-switch"><input type="checkbox" id="autofill"><span class="tp-switch__text"><span data-i18n="op.studio.autofill"></span><span class="tp-help" data-i18n="op.studio.autofillHelp"></span></span></label>
          <label class="tp-switch"><input type="checkbox" id="studioCard"><span class="tp-switch__text"><span data-i18n="op.studio.card"></span></span></label>
          <label class="tp-switch"><input type="checkbox" id="tagSuggest"><span class="tp-switch__text"><span data-i18n="op.studio.tagSuggest"></span></span></label>
          <label class="tp-switch"><input type="checkbox" id="watchCard"><span class="tp-switch__text"><span data-i18n="op.studio.watchCard"></span></span></label>
        </div>
      </section>

      <!-- Profils -->
      <section id="profiles" class="tp-card">
        <div class="tp-card__head"><span class="tp-acc__icon" data-icon="users"></span><h2 class="tp-h2" data-i18n="op.nav.profiles"></h2><span class="tp-grow"></span><button id="addProfile" class="tp-btn tp-btn--sm"><span data-icon="plus"></span><span data-i18n="op.profiles.add"></span></button></div>
        <div class="tp-card__body">
          <p class="tp-small tp-muted" data-i18n="op.profiles.help"></p>
          <div id="profileList" class="tp-stack"></div>
        </div>
      </section>

      <!-- Sauvegarde -->
      <section id="backup" class="tp-card">
        <div class="tp-card__head"><span class="tp-acc__icon" data-icon="download"></span><h2 class="tp-h2" data-i18n="op.nav.backup"></h2></div>
        <div class="tp-card__body">
          <div class="tp-row">
            <button id="export" class="tp-btn"><span data-icon="download"></span><span data-i18n="op.backup.export"></span></button>
            <label class="tp-btn"><input type="file" id="import" accept="application/json" hidden><span data-icon="upload"></span><span data-i18n="op.backup.import"></span></label>
            <span class="tp-grow"></span>
            <button id="clearCache" class="tp-btn tp-btn--ghost"><span data-icon="trash"></span><span data-i18n="op.backup.clearCache"></span></button>
          </div>
          <div id="backupStatus" class="tp-small"></div>
        </div>
      </section>

      <!-- À propos -->
      <section id="about" class="tp-card">
        <div class="tp-card__head"><span class="tp-acc__icon" data-icon="info"></span><h2 class="tp-h2" data-i18n="op.nav.about"></h2><span id="version" class="tp-chip"></span></div>
        <div class="tp-card__body">
          <p class="tp-small tp-muted" data-i18n="op.about.privacy"></p>
          <p class="tp-small tp-muted" data-i18n="op.about.policy"></p>
          <div class="tp-row">
            <a class="tp-btn tp-btn--sm" id="docLink" target="_blank" rel="noopener"><span data-icon="file"></span><span data-i18n="op.about.docs"></span></a>
            <a class="tp-btn tp-btn--sm" id="privacyLink" target="_blank" rel="noopener"><span data-icon="lock"></span><span data-i18n="op.about.privacyLink"></span></a>
          </div>
          <p class="tp-tiny tp-faint" data-i18n="op.about.trademark"></p>
        </div>
      </section>
    </main>
  </div>
  <div id="saved" class="op-saved tp-hidden"></div>
  <script src="../lib/icons.js"></script>
  <script type="module" src="options.js"></script>
</body>
</html>
