<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TubePilot</title>
  <link rel="stylesheet" href="../lib/tp.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body class="tp-root">
  <header class="sp-top">
    <span id="logo"></span>
    <div class="sp-brand"><b>TubePilot</b><span id="engineChip" class="sp-engine"></span></div>
    <span class="tp-grow"></span>
    <select id="profile" class="tp-select sp-profile" data-i18n-title="panel.profile"></select>
    <button id="openOptions" class="tp-btn tp-btn--ghost tp-btn--icon" data-i18n-title="common.settings"></button>
  </header>

  <nav class="sp-nav" role="tablist">
    <button class="sp-navbtn" data-tab="video" aria-selected="true"><span data-icon="video"></span><span data-i18n="nav.video"></span></button>
    <button class="sp-navbtn" data-tab="keywords"><span data-icon="key"></span><span data-i18n="nav.keywords"></span></button>
    <button class="sp-navbtn" data-tab="competitors"><span data-icon="users"></span><span data-i18n="nav.competitors"></span></button>
    <button class="sp-navbtn" data-tab="trends"><span data-icon="trending"></span><span data-i18n="nav.trends"></span></button>
    <button class="sp-navbtn" data-tab="history"><span data-icon="history"></span><span data-i18n="nav.history"></span></button>
  </nav>

  <main>
    <!-- ================= VIDÉO ================= -->
    <section id="tab-video" class="sp-tab on">
      <div id="ctxCard"></div>

      <div class="tp-card" id="runCard">
        <div class="tp-card__head"><span class="tp-acc__icon" data-icon="sparkles"></span><b class="tp-h2" data-i18n="run.title"></b></div>
        <div class="tp-card__body">
          <div class="tp-seg" id="srcSeg">
            <label><input type="radio" name="src" value="studio" checked><span data-icon="video"></span><span data-i18n="run.srcStudio"></span></label>
            <label><input type="radio" name="src" value="file"><span data-icon="upload"></span><span data-i18n="run.srcFile"></span></label>
            <label><input type="radio" name="src" value="url"><span data-icon="link"></span><span data-i18n="run.srcLink"></span></label>
            <label><input type="radio" name="src" value="express"><span data-icon="zap"></span><span data-i18n="run.srcQuick"></span></label>
          </div>
          <div id="srcHelp" class="tp-help"></div>
          <div id="srcFile" class="tp-hidden"><input type="file" id="fileIn" class="tp-input" accept="video/*,audio/*"></div>
          <div id="srcUrl" class="tp-hidden"><input id="urlIn" class="tp-input" type="url" placeholder="https://www.youtube.com/watch?v=…"></div>
          <details class="sp-adv">
            <summary><span data-icon="sliders"></span><span data-i18n="run.advanced"></span></summary>
            <div class="tp-stack">
              <div class="sp-grid2">
                <label class="tp-field"><span class="tp-label" data-i18n="run.keyword"></span><input id="kwIn" class="tp-input" data-i18n-ph="run.keywordPh"></label>
                <label class="tp-field"><span class="tp-label" data-i18n="run.media"></span>
                  <select id="mediaMode" class="tp-select">
                    <option value="auto" data-i18n="run.mediaAuto"></option>
                    <option value="audio" data-i18n="run.mediaAudio"></option>
                    <option value="video" data-i18n="run.mediaVideo"></option>
                  </select>
                </label>
              </div>
              <label class="tp-field"><span class="tp-label" data-i18n="run.notes"></span><textarea id="notesIn" class="tp-textarea" rows="2" data-i18n-ph="run.notesPh"></textarea></label>
              <label class="tp-field"><span class="tp-label" data-i18n="run.lyrics"></span><textarea id="lyricsIn" class="tp-textarea" rows="3"></textarea></label>
              <label class="tp-switch"><input type="checkbox" id="lyricsChk"><span class="tp-switch__text"><span data-i18n="run.transcribe"></span></span></label>
              <label class="tp-switch"><input type="checkbox" id="compChk"><span class="tp-switch__text"><span data-i18n="run.compare"></span><span class="tp-help" data-i18n="run.compareHelp"></span></span></label>
              <label class="tp-switch"><input type="checkbox" id="webChk"><span class="tp-switch__text"><span data-i18n="run.trends"></span></span></label>
              <label class="tp-switch"><input type="checkbox" id="reChk"><span class="tp-switch__text"><span data-i18n="run.relisten"></span></span></label>
            </div>
          </details>
          <button id="runBtn" class="tp-btn tp-btn--primary tp-btn--lg tp-btn--block"></button>
          <div id="progress" class="tp-hidden"></div>
          <div id="runErr" class="tp-hidden"></div>
        </div>
      </div>

      <details class="tp-acc" id="manualBox">
        <summary><span class="tp-acc__icon" data-icon="copy"></span><span data-i18n="manual.title"></span><span class="tp-acc__chev" data-icon="down"></span></summary>
        <div class="tp-acc__body">
          <ol class="tp-small sp-ol">
            <li data-i18n="manual.step1"></li>
            <li data-i18n="manual.step2"></li>
            <li data-i18n="manual.step3"></li>
          </ol>
          <div class="tp-row">
            <button id="copyPrompt" class="tp-btn tp-btn--sm"><span data-icon="copy"></span><span data-i18n="manual.copy"></span></button>
            <button id="openGemini" class="tp-btn tp-btn--sm"><span data-icon="external"></span><span data-i18n="manual.open"></span></button>
          </div>
          <textarea id="manualIn" class="tp-textarea" rows="4" data-i18n-ph="manual.pastePh"></textarea>
          <button id="manualApply" class="tp-btn tp-btn--sm"><span data-icon="check"></span><span data-i18n="manual.apply"></span></button>
        </div>
      </details>

      <div id="result" class="tp-stack"></div>
    </section>

    <!-- ================= MOTS-CLÉS ================= -->
    <section id="tab-keywords" class="sp-tab">
      <div class="tp-card">
        <div class="tp-card__body">
          <div class="tp-inputgroup">
            <input id="kwSeed" class="tp-input" data-i18n-ph="kw.seedPh">
            <button id="kwGo" class="tp-btn tp-btn--primary"><span data-icon="search"></span><span data-i18n="kw.search"></span></button>
          </div>
          <div class="sp-grid3">
            <label class="tp-field"><span class="tp-label" data-i18n="kw.language"></span><select id="kwHl" class="tp-select"></select></label>
            <label class="tp-field"><span class="tp-label" data-i18n="kw.country"></span><select id="kwGl" class="tp-select"></select></label>
            <label class="tp-switch sp-deep"><input type="checkbox" id="kwDeep" checked><span class="tp-switch__text"><span data-i18n="kw.deep"></span></span></label>
          </div>
          <div class="tp-help" data-i18n="kw.sourceNote"></div>
        </div>
      </div>
      <details class="tp-acc" id="kpBox">
        <summary><span class="tp-acc__icon" data-icon="chart"></span><span data-i18n="kp.title"></span><span id="kpState" class="tp-faint tp-small"></span><span class="tp-acc__chev" data-icon="down"></span></summary>
        <div class="tp-acc__body">
          <div class="tp-small tp-muted" data-i18n="kp.help"></div>
          <ol class="tp-small sp-ol">
            <li data-i18n-html="kp.step1"></li>
            <li data-i18n="kp.step2"></li>
            <li data-i18n="kp.step3"></li>
          </ol>
          <div class="tp-row">
            <label class="tp-btn tp-btn--primary tp-btn--sm"><input type="file" id="kpFile" accept=".csv,.tsv,text/csv,text/tab-separated-values" hidden multiple><span data-icon="upload"></span><span data-i18n="kp.import"></span></label>
            <a class="tp-btn tp-btn--sm" href="https://ads.google.com/aw/keywordplanner/home" target="_blank" rel="noopener"><span data-icon="external"></span><span data-i18n="kp.open"></span></a>
            <button id="kpClear" class="tp-btn tp-btn--ghost tp-btn--sm"><span data-icon="trash"></span><span data-i18n="kp.clear"></span></button>
          </div>
          <div id="kpMsg" class="tp-small"></div>
        </div>
      </details>
      <div id="kwProgress"></div>
      <div id="kwResults"></div>
      <div id="kwDetail"></div>
      <div class="tp-card sp-basket" id="basketBox">
        <div class="tp-card__head"><span data-icon="tag"></span><b data-i18n="basket.title"></b><span id="basketInfo" class="tp-counter"></span><span class="tp-grow"></span>
          <button class="tp-btn tp-btn--ghost tp-btn--sm tp-btn--icon" id="basketCopy" data-i18n-title="common.copy"><span data-icon="copy"></span></button>
          <button class="tp-btn tp-btn--sm" id="basketInsert"><span data-icon="upload"></span><span data-i18n="basket.insert"></span></button>
          <button class="tp-btn tp-btn--ghost tp-btn--sm tp-btn--icon" id="basketClear" data-i18n-title="basket.clear"><span data-icon="trash"></span></button>
        </div>
        <div class="tp-card__body"><div id="basketChips" class="tp-chips"></div></div>
      </div>
    </section>

    <!-- ================= CONCURRENTS ================= -->
    <section id="tab-competitors" class="sp-tab">
      <div class="tp-card">
        <div class="tp-card__body">
          <div class="tp-inputgroup">
            <input id="compIn" class="tp-input" data-i18n-ph="comp.addPh">
            <button id="compAdd" class="tp-btn tp-btn--primary"><span data-icon="plus"></span><span data-i18n="comp.follow"></span></button>
          </div>
          <div id="compList" class="tp-list"></div>
        </div>
      </div>
      <div class="tp-card">
        <div class="tp-card__head"><span data-icon="flame"></span><b data-i18n="comp.outliers"></b><span class="tp-grow"></span><button id="compRefresh" class="tp-btn tp-btn--sm"><span data-icon="refresh"></span><span data-i18n="comp.refresh"></span></button></div>
        <div class="tp-card__body"><div id="compVideos" class="tp-list"></div></div>
      </div>
      <div id="compInsights"></div>
    </section>

    <!-- ================= TENDANCES ================= -->
    <section id="tab-trends" class="sp-tab">
      <div class="tp-card">
        <div class="tp-card__body">
          <div class="sp-grid3">
            <label class="tp-field"><span class="tp-label" data-i18n="kw.country"></span><select id="trGl" class="tp-select"></select></label>
            <label class="tp-field"><span class="tp-label" data-i18n="trends.category"></span>
              <select id="trCat" class="tp-select">
                <option value="10" data-i18n="cat.music"></option>
                <option value="0" data-i18n="cat.all"></option>
                <option value="24" data-i18n="cat.entertainment"></option>
                <option value="22" data-i18n="cat.people"></option>
                <option value="20" data-i18n="cat.gaming"></option>
                <option value="27" data-i18n="cat.education"></option>
                <option value="17" data-i18n="cat.sports"></option>
                <option value="23" data-i18n="cat.comedy"></option>
              </select>
            </label>
            <button id="trGo" class="tp-btn tp-btn--primary sp-alignend"><span data-icon="trending"></span><span data-i18n="trends.load"></span></button>
          </div>
        </div>
      </div>
      <div id="trResults" class="tp-stack"></div>
    </section>

    <!-- ================= HISTORIQUE ================= -->
    <section id="tab-history" class="sp-tab">
      <div id="histList"></div>
    </section>
  </main>

  <div class="sp-actions tp-hidden" id="actionBar">
    <button class="tp-btn tp-btn--primary" data-act="insAll"><span data-icon="check"></span><span data-i18n="result.applyAll"></span></button>
    <button class="tp-btn" data-act="regen" data-i18n-title="studio.regenHint"><span data-icon="refresh"></span><span data-i18n="studio.regen"></span></button>
  </div>
  <footer id="status" class="sp-foot"></footer>
  <script src="../lib/icons.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
